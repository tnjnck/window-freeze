<!doctype html>
<html><head><meta charset="utf-8">
<style>
  body{font:13px system-ui,sans-serif;margin:0;min-width:220px}
  h1{font-size:11px;font-weight:600;color:#888;margin:8px 10px 2px;text-transform:uppercase}
  button{display:block;width:100%;text-align:left;border:0;background:none;padding:6px 10px;font:inherit;cursor:pointer}
  button:hover{background:rgba(128,128,128,.15)}
  .row{display:flex}
  .row button{width:auto;flex:1;text-align:center}
  .state{color:#888;margin:0 10px 6px}
</style></head>
<body>
  <h1>This window</h1>
  <button data-act="freeze-now">Freeze now</button>
  <div class="state" id="wstate"></div>
  <div class="row">
    <button data-act="exempt" data-ms="3600000">No freeze 1 h</button>
    <button data-act="exempt" data-ms="inf">Never</button>
    <button data-act="exempt" data-ms="0">Clear</button>
  </div>
  <h1>All windows</h1>
  <div class="state" id="gstate"></div>
  <div class="row">
    <button data-act="pause" data-ms="3600000">Pause 1 h</button>
    <button data-act="pause" data-ms="inf">Pause</button>
    <button data-act="pause" data-ms="0">Resume</button>
  </div>
  <script src="popup.js"></script>
</body></html>
